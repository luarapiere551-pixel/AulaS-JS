        <script>
           window.alert("realizador de contas");

        let num1 = parseInt(window.prompt("informe o primeiro numero? "));
        let num2 = parseInt(window.prompt("informe o segundo numero?"))
        let resultado = 0

        let opr = window.prompt("Qual operação sinal de (+) para soma sinal de (-) para subtração  ?")
        if (opr == "+"){
            resultado =  num1 + num2

           resultado = num1 - num2
        }

        
        window.alert(resultado)
